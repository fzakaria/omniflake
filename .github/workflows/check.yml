# Validate a change to the index or the tooling.
#
# A pull request that only adds a line to manual.txt, blocklist.txt,
# always.txt or names.txt passes without pinning anything: the databases it
# would change
# are fetched rather than committed, so index.json does not move until a
# pipeline run regenerates it. That run is the nightly update workflow, or
# tools/update.sh by hand.
name: check

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs, to exercise the workflow itself from a branch before it
  # lands: gh workflow run check --ref <branch>. The pull_request-gated
  # verify step stays skipped on these.
  workflow_dispatch:
  # The daily index commit is pushed with the default token, which starts
  # no push-triggered workflow, so it is checked from here instead.
  workflow_run:
    workflows: [update index]
    types: [completed]
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Upstream Nix: the previous installer shipped Determinate Nix,
      # whose lazy trees changed what `nix flake metadata` returns.
      - uses: cachix/install-nix-action@v31
        with:
          # Some indexed flakes are written with the pipe operator; they are
          # pinned with the feature on and need it on to evaluate.
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      # Pushes what the job builds: the formatter, the tools, the docs and
      # site derivations. Pull requests from forks have no token and only
      # pull.
      - uses: cachix/cachix-action@v17
        with:
          name: omniflake
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Lock and count
        run: |
          nix flake lock
          git diff --exit-code flake.lock
          echo "flakes indexed: $(nix eval .#lib.count)"

      # tests/index.nix (index and locks/ are consistent), tests/loader.nix
      # (the loader on flakes known to evaluate) and the formatter.
      - name: Checks
        run: nix flake check -L

      - name: Index matches the databases
        # index.json is derived from pins.jsonl, failures.jsonl and the
        # blocklist. A hand edit that drifts from them is caught here.
        #
        # pins.jsonl is fetched rather than committed, so `git diff` cannot
        # speak for it. generate.py prunes it, and --check compares what
        # that left against the pin: a prune that never went into a release
        # cut would otherwise pass every gate and leave the site building
        # from bytes the index no longer agrees with.
        run: |
          nix run .#fetch-data
          nix run .#classify -- --rejected personal.jsonl < resolved.jsonl > library.jsonl
          nix run .#generate
          git diff --exit-code -- index.json unify.json failures.jsonl locks
          nix run .#fetch-data -- --check

      # The regeneration diff above proves internal consistency but takes
      # the pins rows on faith. Re-derive every pin the pull request adds
      # or modifies with `nix flake metadata`, and evaluate every new
      # name, so a wrong revision or narHash cannot enter the index.
      - name: Verify changed pins
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE"
          nix run .#verify -- --base "$BASE"

      - name: Evaluate a sample
        # Informational: see tools/sample.py. The counts go to the job
        # summary.
        run: nix run .#sample -- --size 25
